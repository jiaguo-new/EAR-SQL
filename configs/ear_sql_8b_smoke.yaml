# Tiny 8B RL-training smoke: prove the GRPO + EAR loop runs end-to-end on GB10
# (loss computed, optimizer steps, EAR metrics nonzero, no OOM). NOT a real run:
# trains on a few dev examples; use ear_sql_8b.yaml for a fuller run.
model:
  base: /home/dameng/.cache/modelscope/hub/models/Qwen/Qwen3-8B
  sft_init: /home/dameng/.cache/modelscope/hub/models/Qwen/Qwen3-8B
  max_prompt_len: 6144
  max_gen_len: 512

data:
  train: ./data/bird/dev.json
  eval_bird: ./data/bird/dev.json
  db_root: ./data/bird/dev_databases
  dialect: sqlite

grpo:
  group_size: 4
  lr: 1.0e-6
  kl_coef: 0.001
  clip_eps: 0.2
  batch_prompts: 2
  temperature: 1.0
  total_steps: 2

resample:
  enabled: true
  K: 2
  budget_ratio: 0.5
  trigger: all_wrong
  rank_by: action_uncertainty
  recovery_reward: binary
  separate_advantage: true
  mask_prefix_in_suffix_adv: true

reward:
  exec_weight: 1.0
  syntax_weight: 0.0
  exec_timeout_s: 30

logging:
  out_dir: ./runs/ear_sql_8b_smoke
  eval_every: 100
  save_every: 200
