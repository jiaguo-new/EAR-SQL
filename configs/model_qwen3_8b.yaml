model:
  base: /home/dameng/.cache/modelscope/hub/models/Qwen/Qwen3-8B
  sft_init: /home/dameng/.cache/modelscope/hub/models/Qwen/Qwen3-8B
  max_prompt_len: 6144
  max_gen_len: 1024

data:
  train: ./data/synsql_filtered.jsonl
  eval_bird: ./data/bird/dev.json
  db_root: ./data/bird/dev_databases
  dialect: sqlite

grpo:
  group_size: 8
  lr: 1.0e-6
  kl_coef: 0.001
  clip_eps: 0.2
  batch_prompts: 64
  temperature: 1.0
  total_steps: 20

resample:
  enabled: true
  K: 2
  budget_ratio: 0.5
  trigger: all_wrong
  rank_by: action_uncertainty
  recovery_reward: binary
  separate_advantage: true
  mask_prefix_in_suffix_adv: true

reward:
  exec_weight: 1.0
  syntax_weight: 0.0
  exec_timeout_s: 30

logging:
  out_dir: ./runs/ear_sql_7b
  eval_every: 100
  save_every: 200
